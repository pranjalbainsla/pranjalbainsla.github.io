<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hi, I'm Pranjal</title>
  <meta name="description" content="A tiny toy-block hacker's room. Walk to the computer to open my projects." />
  <meta name="theme-color" content="#f6cfd8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23f6cfd8'/%3E%3Crect x='1' y='1' width='6' height='5' fill='%23241b3a'/%3E%3Crect x='2' y='4' width='2' height='1' fill='%2339ff7a'/%3E%3Crect x='3' y='6' width='2' height='1' fill='%23c9b8e8'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Non-blocking fonts: load as print media, switch to all once fetched. -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="./css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/geometries/RoundedBoxGeometry.js": "./vendor/RoundedBoxGeometry.js",
        "three/addons/postprocessing/EffectComposer.js": "./vendor/postprocessing/EffectComposer.js",
        "three/addons/postprocessing/RenderPass.js": "./vendor/postprocessing/RenderPass.js",
        "three/addons/postprocessing/GTAOPass.js": "./vendor/postprocessing/GTAOPass.js",
        "three/addons/postprocessing/UnrealBloomPass.js": "./vendor/postprocessing/UnrealBloomPass.js",
        "three/addons/postprocessing/ShaderPass.js": "./vendor/postprocessing/ShaderPass.js",
        "three/addons/postprocessing/OutputPass.js": "./vendor/postprocessing/OutputPass.js"
      }
    }
  </script>
  <link rel="modulepreload" href="./js/main.js" />
  <link rel="modulepreload" href="./js/room.js" />
  <link rel="modulepreload" href="./js/ui.js" />
  <link rel="modulepreload" href="./js/character.js" />
  <link rel="modulepreload" href="./js/weather.js" />
  <link rel="modulepreload" href="./js/audio.js" />
  <link rel="modulepreload" href="./js/helpers.js" />
  <link rel="modulepreload" href="./vendor/three.module.min.js" />
  <link rel="modulepreload" href="./vendor/RoundedBoxGeometry.js" />
  <link rel="modulepreload" href="./vendor/math/SimplexNoise.js" />
  <link rel="modulepreload" href="./vendor/postprocessing/EffectComposer.js" />
  <link rel="modulepreload" href="./vendor/postprocessing/GTAOPass.js" />
  <link rel="modulepreload" href="./vendor/postprocessing/MaskPass.js" />
  <link rel="modulepreload" href="./vendor/postprocessing/OutputPass.js" />
  <link rel="modulepreload" href="./vendor/postprocessing/Pass.js" />
  <link rel="modulepreload" href="./vendor/postprocessing/RenderPass.js" />
  <link rel="modulepreload" href="./vendor/postprocessing/ShaderPass.js" />
  <link rel="modulepreload" href="./vendor/postprocessing/UnrealBloomPass.js" />
  <link rel="modulepreload" href="./vendor/shaders/CopyShader.js" />
  <link rel="modulepreload" href="./vendor/shaders/GTAOShader.js" />
  <link rel="modulepreload" href="./vendor/shaders/LuminosityHighPassShader.js" />
  <link rel="modulepreload" href="./vendor/shaders/OutputShader.js" />
  <link rel="modulepreload" href="./vendor/shaders/PoissonDenoiseShader.js" />
</head>
<body>
  <canvas id="scene" aria-label="A 3D toy diorama of a cozy hacker's room"></canvas>

  <header class="title-card">
    <h1 class="pixel-title" aria-label="Hi, I'm Pranjal">
      <span>hello</span><span>I'm pranjal</span>
    </h1>
    <p class="subtitle">Welcome to my little corner of the internet!</p>
    <p class="wip">...under construction</p>
    <p class="links">
      <a href="https://github.com/pranjalbainsla" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub"><i data-icon="github"></i></a>
      <a href="mailto:pranjalbainsla@gmail.com" aria-label="Email" title="Email"><i data-icon="mail"></i></a>
    </p>
  </header>

  <nav class="weather-bar" aria-label="Weather outside the window">
    <button class="pixel-btn weather" data-weather="sunny" type="button" aria-pressed="true" aria-label="Sunny" title="Sunny"><i data-icon="sunny"></i></button>
    <button class="pixel-btn weather" data-weather="rain" type="button" aria-pressed="false" aria-label="Rain + Thunder" title="Rain + Thunder"><i data-icon="rain"></i></button>
    <button class="pixel-btn weather" data-weather="snow" type="button" aria-pressed="false" aria-label="Snow" title="Snow"><i data-icon="snow"></i></button>
    <button class="pixel-btn weather" data-weather="autumn" type="button" aria-pressed="false" aria-label="Autumn leaves" title="Autumn leaves"><i data-icon="autumn"></i></button>
    <button class="pixel-btn weather" data-weather="night" type="button" aria-pressed="false" aria-label="Night" title="Night"><i data-icon="night"></i></button>
    <button id="sound-toggle" class="pixel-btn weather-sound" type="button" aria-pressed="false" aria-label="Toggle sound" title="Sound"><i data-icon="sound-off" class="ico-off"></i><i data-icon="sound-on" class="ico-on"></i></button>
  </nav>

  <div id="prompt" class="prompt" hidden></div>

  <div id="dialogue" class="dialogue" role="status" aria-live="polite" hidden>
    <div class="dialogue-name" id="dialogue-name"></div>
    <p class="dialogue-text" id="dialogue-text"></p>
    <span class="dialogue-next">Enter ▾</span>
  </div>

  <div id="terminals" class="terminals" aria-live="polite"></div>

  <div id="postcard" class="pc-layer" hidden>
    <div class="pc-stage">
      <i class="pc-env pc-env-back" data-icon="envelope-open"></i>
      <article class="postcard" role="dialog" aria-modal="true" aria-labelledby="pc-title" aria-describedby="pc-note">
        <div class="pc-slide">
          <div class="pc-frame">
            <div class="pc-paper">
              <div class="pc-message">
                <p class="pc-note" id="pc-note"></p>
                <p class="pc-sign">— P. <i class="pc-seal" data-icon="seal"></i></p>
              </div>
              <div class="pc-divider" aria-hidden="true"></div>
              <div class="pc-address">
                <div class="pc-stamps">
                  <i data-icon="stamp-green"></i>
                  <i data-icon="stamp-blue"></i>
                  <div class="pc-postmark"><i data-icon="postmark"></i><time class="pc-date" id="pc-date"></time></div>
                </div>
                <h2 class="pc-title" id="pc-title" aria-live="polite"></h2>
                <p class="pc-from" id="pc-from"></p>
                <div class="pc-actions">
                  <a id="pc-visit" class="pixel-btn" href="#" target="_blank" rel="noopener">VISIT <i data-icon="arrow"></i></a>
                  <button id="pc-again" class="pixel-btn" type="button" aria-keyshortcuts="R">ANOTHER <i data-icon="again"></i></button>
                </div>
              </div>
              <p class="pc-foot" id="pc-count"></p>
            </div>
          </div>
          <button id="pc-close" class="pixel-btn small pc-close" type="button" aria-label="Close postcard" aria-keyshortcuts="Escape"><i data-icon="close"></i></button>
        </div>
      </article>
      <i class="pc-env pc-env-pocket" data-icon="envelope-pocket"></i>
      <i class="pc-env pc-env-closed" data-icon="envelope-closed"></i>
    </div>
  </div>

  <div class="touch-controls" id="touch-controls" aria-hidden="true">
    <div class="dpad">
      <button data-dir="up" class="pad up" type="button">▲</button>
      <button data-dir="left" class="pad left" type="button">◀</button>
      <button data-dir="right" class="pad right" type="button">▶</button>
      <button data-dir="down" class="pad down" type="button">▼</button>
    </div>
    <button id="action-btn" class="action" type="button">A</button>
  </div>

  <div id="loader" class="loader">
    <p>booting room<span class="blink">_</span></p>
  </div>

  <noscript><p class="noscript">This little room needs JavaScript and WebGL to load.</p></noscript>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
